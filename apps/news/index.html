  <main id="main">
    <h1 class="visually-hidden">News — Worldwide Trending News Dashboard</h1>
    <div class="news-layout">
      <!-- Content Area -->
      <div class="news-content" id="newsContent">
        <div id="notificationArea" aria-live="polite"></div>
        <div class="loading-indicator" id="loadingIndicator">Loading articles...</div>
        <noscript>
          <style>
            #loadingIndicator, #topStories, #trendingSection { display: none !important; }
            .noscript-fallback { padding: var(--space-lg) var(--space-md); }
            .noscript-fallback p { color: var(--color-text-secondary); margin-bottom: var(--space-md); }
            .noscript-fallback h2 { font-size: var(--text-lg); margin-bottom: var(--space-sm); }
            .noscript-fallback ul { list-style: disc; padding-left: var(--space-lg); }
            .noscript-fallback li { margin-bottom: var(--space-xs); }
            .noscript-fallback a { color: var(--color-accent); }
          </style>
          <div class="noscript-fallback">
            <p>News is a worldwide trending-news dashboard that aggregates stories from Hacker News, BBC, The Guardian, The Verge, Ars Technica, TechCrunch, DEV, and more — with category filters and full-text search. It requires JavaScript to fetch the latest articles; enable JavaScript for the live feed.</p>
            <h2>News sources</h2>
            <ul>
              <li><a href="https://news.ycombinator.com/front" target="_blank" rel="noopener noreferrer">Hacker News — front page</a></li>
              <li><a href="https://www.bbc.com/news" target="_blank" rel="noopener noreferrer">BBC News</a></li>
              <li><a href="https://www.theguardian.com" target="_blank" rel="noopener noreferrer">The Guardian</a></li>
              <li><a href="https://www.theverge.com" target="_blank" rel="noopener noreferrer">The Verge</a></li>
              <li><a href="https://arstechnica.com" target="_blank" rel="noopener noreferrer">Ars Technica</a></li>
              <li><a href="https://techcrunch.com" target="_blank" rel="noopener noreferrer">TechCrunch</a></li>
              <li><a href="https://dev.to" target="_blank" rel="noopener noreferrer">DEV Community</a></li>
            </ul>
          </div>
        </noscript>
        <section class="top-stories" id="topStories" aria-label="Top stories" style="display:none">
          <h2 class="top-stories-title">Top Stories</h2>
          <div class="top-stories-list" id="topStoriesList"></div>
        </section>
        <div class="story-list" id="storyList" role="feed" aria-label="News articles"></div>
        <!-- Trending Detail View (hidden by default) -->
        <div class="trending-detail" id="trendingDetail" hidden aria-label="Trending topic detail"></div>
      </div>

      <!-- Trending Topics -->
      <aside class="trending" id="trendingSection" aria-label="Worldwide trending topics">
        <h2 class="trending-title">
          <svg class="trending-title-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Trending
          <span class="trending-title-cat" id="trendingTitleCat" hidden></span>
        </h2>
        <div class="trending-chips" id="trendingChips"></div>
      </aside>
    </div>
